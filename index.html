<title>EcoMovilidad</title>

<meta name="apple-mobile-web-app-title" content="EcoMovilidad">

<style>
/* Layout: app de una columna (cabecera, contenido, barra de pestañas), centrada a 440px; sistema de diseño del portal web EcoMovilidad: ink + volt, Archivo expandida */
:root{
  --ink:#07111F; --ink-2:#0E1B2E; --ink-3:#16263D; --volt:#39E58C; --paper:#F8FAFC; --ink-muted:#9FB0C5; --ink-line:rgba(248,250,252,.12);
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#EEF2F6; --fg:#07111F; --muted:#5B6B80; --line:#DCE3EC; --input:#CFD8E3;
  --accent:#0B7A45; --accent-soft:rgba(11,122,69,.10); --primary:#07111F; --primary-ink:#F8FAFC;
  --success:#0A6E3F; --success-soft:rgba(10,110,63,.10); --warning:#8F5106; --warning-soft:rgba(143,81,6,.10);
  --danger:#C42B1C; --danger-soft:rgba(196,43,28,.10); --info:#1D5FA8; --info-soft:rgba(29,95,168,.10);
  --f-sans:"Archivo",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07111F; --surface:#0E1B2E; --surface-2:#16263D; --fg:#F8FAFC; --muted:#9FB0C5; --line:rgba(248,250,252,.12); --input:rgba(248,250,252,.2);
  --accent:#39E58C; --accent-soft:rgba(57,229,140,.12); --primary:#F8FAFC; --primary-ink:#07111F;
  --success:#4ADE95; --success-soft:rgba(74,222,149,.12); --warning:#F2B35A; --warning-soft:rgba(242,179,90,.12);
  --danger:#FF7A6B; --danger-soft:rgba(255,122,107,.12); --info:#7DB6F5; --info-soft:rgba(125,182,245,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07111F; --surface:#0E1B2E; --surface-2:#16263D; --fg:#F8FAFC; --muted:#9FB0C5; --line:rgba(248,250,252,.12); --input:rgba(248,250,252,.2);
  --accent:#39E58C; --accent-soft:rgba(57,229,140,.12); --primary:#F8FAFC; --primary-ink:#07111F;
  --success:#4ADE95; --success-soft:rgba(74,222,149,.12); --warning:#F2B35A; --warning-soft:rgba(242,179,90,.12);
  --danger:#FF7A6B; --danger-soft:rgba(255,122,107,.12); --info:#7DB6F5; --info-soft:rgba(125,182,245,.12); color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"ss01"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--volt);color:var(--ink)}
.d{font-stretch:118%;font-weight:760;letter-spacing:-.025em;line-height:1.04}
.dt{font-stretch:112%;font-weight:700;letter-spacing:-.015em;line-height:1.12}
.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.hdr{flex:none;display:flex;align-items:center;gap:8px;min-height:58px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.hdr h1{flex:1;min-width:0;margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{width:32px;height:32px;flex:none;display:block}
.iconbtn{position:relative;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--volt);color:var(--ink);font-size:10.5px;font-weight:800;display:grid;place-items:center}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.main>*{flex-shrink:0}
.tabs{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding-block:6px 4px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:10.5px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{background:var(--volt);color:var(--ink);border-radius:999px;box-shadow:0 0 0 5px var(--volt)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
.tab svg.i{width:20px;height:20px}
/* superficie oscura de marca */
.ink{background:var(--ink);color:var(--paper);--muted:var(--ink-muted);--line:var(--ink-line);--surface:var(--ink-2);--surface-2:var(--ink-3);--fg:var(--paper);--accent:var(--volt);--primary:var(--paper);--primary-ink:var(--ink)}
.bleed{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{margin-top:-16px;padding-block:28px 24px;display:flex;flex-direction:column;gap:16px}
.hero h2{margin:0;font-size:clamp(40px,12vw,52px);text-wrap:balance}
.hero p{margin:0;font-size:17px;color:var(--ink-muted);max-width:30ch}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.sec-h h2{margin:0;font-size:22px;text-wrap:balance}
.sec-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .sub{font-size:13px;color:var(--muted)}
.chev{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:12px 20px;font-weight:650;background:var(--primary);color:var(--primary-ink);min-height:50px;font-size:15.5px}
.btn.brand{background:var(--volt);color:var(--ink)}
.btn.outline{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.block{width:100%}
.btn.ghost{background:none;color:var(--fg);padding:6px 10px;min-height:0;text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:14px}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 auto}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.chip:disabled{opacity:.4}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:650;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--success-soft);color:var(--success)}
.pill.warn{background:var(--warning-soft);color:var(--warning)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.volt{background:var(--volt);color:var(--ink)}
.sdot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.sdot i{width:8px;height:8px;border-radius:50%;display:inline-block}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:600}
.input,select.input,textarea.input{width:100%;border:1px solid var(--input);background:var(--surface);border-radius:12px;padding:12px 13px;font-size:16px;min-height:48px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.form{display:flex;flex-direction:column;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}
.err{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}
.note{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:999px;padding:9px 6px;font-weight:650;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(7,17,31,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;font-stretch:112%;font-weight:760;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi i{display:block;height:4px;border-radius:2px;margin-bottom:6px;width:28px}
.promo{border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;background:var(--volt);color:var(--ink)}
.promo b{display:block;font-size:17px}
.promo p{margin:2px 0 0;font-size:13.5px;opacity:.85}
.promo .btn{background:var(--ink);color:var(--paper);min-height:40px;padding:8px 14px;font-size:13.5px;flex:none}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid var(--ink-line);border-radius:18px;overflow:hidden;padding:0;text-align:left;background:var(--ink);color:var(--paper);display:flex;flex-direction:column}
.cat img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.cat div{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;padding:12px}
.cat span{color:var(--ink-muted);font-size:13px}
.vp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vp .card{display:flex;flex-direction:column;gap:6px;padding:14px}
.vp .card b{font-size:14.5px}
.vp .card p{margin:0;font-size:12.5px;color:var(--muted)}
.ic{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding-bottom:16px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--volt);color:var(--ink);display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.step b{display:block;margin-top:5px}
.step p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.rlist{border-top:1px solid var(--ink-line)}
.rlist button{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:15px 0;border:0;border-bottom:1px solid var(--ink-line);background:none;width:100%;text-align:left;color:var(--paper)}
.rlist .p{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.rlist .s{font-size:13px;color:var(--ink-muted)}
/* productos */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column;position:relative}
.ph{position:relative;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .badge{position:absolute;top:8px;left:8px;border-radius:999px;background:var(--volt);color:var(--ink);font-size:11px;font-weight:700;padding:3px 9px}
.row .ph .badge{display:none}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:10px}
.pcard .body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.pcard .meta{font-size:12px;color:var(--muted)}
.pcard .name{font-size:15px}
.price{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.strike{text-decoration:line-through;color:var(--muted);font-size:12.5px;font-weight:500}
.hero-ph{border-radius:20px}
.price-xl{font-size:30px;font-stretch:112%;font-weight:760;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.hl li{display:flex;gap:8px;align-items:center;font-size:14px}
.hl li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--volt);flex:none}
.spec{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.spec:last-child{border-bottom:0}
.spec span{color:var(--muted)}
.spec b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{width:42px;height:42px;border:0;background:none;font-size:20px;font-weight:700}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.opt:disabled{opacity:.45}
.opt .grow{flex:1;min-width:0}
.opts{display:flex;flex-direction:column;gap:8px}
.slotgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;text-align:left}
.slot b{display:block;font-size:13.5px;font-variant-numeric:tabular-nums}
.slot span{font-size:12px;color:var(--muted)}
.slot[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.slot:disabled{opacity:.4}
.sum{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sum.total{font-weight:750;font-size:17px;padding-top:10px;border-top:1px dashed var(--line)}
.timer{display:inline-flex;align-items:center;gap:6px;background:var(--warning-soft);color:var(--warning);font-weight:700;border-radius:999px;padding:4px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--success)}
.bar.w>i{background:var(--warning)} .bar.d>i{background:var(--danger)}
.tl{display:flex;flex-direction:column;padding-left:2px}
.tl-i{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;margin-top:2px;z-index:1}
.tl-i.done .tl-dot{background:var(--volt);border-color:var(--volt)}
.tl-i.now .tl-dot{background:var(--surface);border:4px solid var(--volt)}
.tl-i.fail .tl-dot{background:var(--danger);border-color:var(--danger)}
.tl-i .t{font-weight:650;font-size:14px}
.tl-i .sub{font-size:12.5px;color:var(--muted)}
/* mapa (estilo oscuro del portal) */
.map{position:relative;border-radius:18px;overflow:hidden;background:#0E1B2E;border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto;touch-action:manipulation}
.map .legend{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap}
.map .legend span{background:rgba(7,17,31,.82);color:#F8FAFC;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.map .legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.map .live{position:absolute;right:8px;top:8px;background:rgba(7,17,31,.82);color:#F8FAFC;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.map .live i{width:7px;height:7px;border-radius:50%;background:#39E58C;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@keyframes ping{0%{r:6;opacity:.7}100%{r:22;opacity:0}}
.ping{animation:ping 1.6s ease-out infinite}
.overlay{position:absolute;inset:0;background:rgba(7,17,31,.55);z-index:40;display:flex;align-items:flex-end;animation:fade .18s}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding-block:8px 26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-h h3{margin:0;font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;z-index:60;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(7,17,31,.25);animation:up .2s;border:1px solid var(--ink-line)}
.alertbar{flex:none;background:var(--danger);color:#fff;display:flex;align-items:center;gap:10px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13.5px;font-weight:700;border:0;width:100%;text-align:left}
.qrbox{background:#fff;border-radius:16px;padding:14px;display:grid;place-items:center;width:220px;max-width:100%;margin:0 auto}
.qrbox svg{width:100%;height:auto}
.code{font-family:var(--f-mono);font-size:26px;font-weight:600;letter-spacing:.18em;text-align:center}
canvas.sig{width:100%;height:170px;background:var(--surface);border:1.5px dashed var(--input);border-radius:14px;touch-action:none;display:block}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg.i{width:36px;height:36px}
.invoice{background:#fff;color:#07111F;border-radius:14px;padding:16px;font-size:12.5px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.invoice h4{margin:0;font-size:16px}
.invoice .r{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.invoice hr{border:0;border-top:1px dashed #bbb;margin:2px 0;width:100%}
pre.xml{margin:0;background:var(--surface-2);border-radius:12px;padding:12px;font-family:var(--f-mono);font-size:11px;overflow-x:auto;white-space:pre}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--volt);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:19px;font-stretch:112%;flex:none}
.cu{font-family:var(--f-mono);font-size:11.5px;font-weight:600;background:var(--surface-2);border-radius:6px;padding:2px 6px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--surface-2);border-top-color:var(--volt);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.big-ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center}
.big-ic svg.i{width:38px;height:38px;stroke-width:2.2}
.hstack{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.range{width:100%;accent-color:var(--accent)}
h2.title{margin:0;font-size:27px;text-wrap:balance}
.gw{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.credit{font-size:11.5px;color:var(--muted);margin:6px 0 0}
.credit a{color:inherit}
a{color:var(--accent)}
.btn,.row,.pcard,.cat,.opt,.slot,.chip,.tab,.iconbtn{transition:transform .12s ease,opacity .12s}
.btn:active,.pcard:active,.cat:active,.opt:active,.slot:active,.iconbtn:active{transform:scale(.97)}
.row:active{opacity:.6}
.main.enter>*{animation:enter .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateX(14px)}}
.splash{position:absolute;inset:0;z-index:90;background:#07111F;display:grid;place-items:center;transition:opacity .35s}
.splash.out{opacity:0;pointer-events:none}
.splash .mk{width:88px;height:88px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.splash b{display:block;color:#F8FAFC;margin-top:14px;font-size:24px;text-align:center;animation:enter .5s .2s both}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.onb{position:absolute;inset:0;z-index:80;background:#07111F;color:#F8FAFC;display:flex;flex-direction:column;padding-block:20px 24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));gap:18px}
.onb .skip{align-self:flex-end;background:none;border:0;color:#9FB0C5;font-weight:600;padding:8px}
.onb .pic{flex:1;min-height:0;border-radius:24px;overflow:hidden;background:#0E1B2E;display:grid;place-items:center}
.onb .pic img{width:100%;height:100%;object-fit:cover}
.onb h2{margin:0;font-size:34px;text-wrap:balance}
.onb p{margin:0;color:#9FB0C5;font-size:16px;max-width:32ch}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:4px;background:#16263D;transition:width .2s}.dots i.on{width:22px;background:#39E58C}
.nbanner{position:absolute;top:8px;left:10px;right:10px;z-index:70;background:rgba(248,250,252,.96);color:#07111F;border-radius:20px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 10px 30px rgba(7,17,31,.28);animation:drop .35s cubic-bezier(.2,1,.3,1);border:0;text-align:left;width:auto}
.nbanner svg.mark{width:36px;height:36px;border-radius:9px}
.nbanner .h{display:flex;justify-content:space-between;font-size:12px;color:#5B6B80;font-weight:600}
.nbanner b{display:block;font-size:14px}
.nbanner span.b{display:block;font-size:13px;color:#16263D;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@keyframes drop{from{transform:translateY(-120%)}}
.toggle{appearance:none;width:51px;height:31px;border-radius:16px;background:var(--surface-2);position:relative;flex:none;cursor:pointer;transition:background .2s;border:1px solid var(--line)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle:checked{background:#39E58C}.toggle:checked::after{transform:translateX(20px)}
</style>

const me = () => DB.session && DB.session.exp > now() ? DB.users.find(u => u.id === DB.session.userId) : null;
const role = () => me()?.role || 'visitante';

const branch = id => DB.branches.find(b => b.id === id);

const availTotal = p => DB.inventory.filter(i => i.productId === p).reduce((s, i) => s + i.available, 0);
const cart = () => { const u = me(); if (!u) return {items:[]}; return DB.carts[u.id] || (DB.carts[u.id] = {items:[]}); };

const invoiceOf = orderId => DB.invoices.find(i => i.orderId === orderId);
const refundOf = orderId => DB.refunds.filter(r => r.orderId === orderId).slice(-1)[0];
const userName = id => { const u = DB.users.find(x => x.id === id); return u ? `${u.first} ${u.last}` : '—'; };
const imgOf = p => p.img && IMGS[p.img] ? IMGS[p.img] : null;
const unitBlocked = u => u.status !== 'operativo' || u.usage >= u.threshold * MAINT_PCT;
const RENT_HOLD = ['pending','confirmed','active'];
const rentalNow = u => DB.orders.find(o => o.kind === 'alquiler' && o.unitId === u.id && o.status === 'active');
function unitFree(u, start, end){ if (unitBlocked(u)) return false; return !DB.orders.some(o => o.kind === 'alquiler' && o.unitId === u.id && RENT_HOLD.includes(o.status) && o.startAt < end && start < o.endAt); }
function slotUsed(branchId, date, slot){ return DB.orders.filter(o => o.kind === 'compra' && o.branchId === branchId && o.date === date && o.slot === slot && o.status !== 'cancelled').length; }
function slotPassed(date, s){ if (date !== dayOffset(0)) return false; const n = new Date(); return s.start <= `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; }
function notify(userId, channel, subject, body){ DB.notifications.unshift({id:uid('nt'), userId, channel, subject, body, at:now(), read:false}); if (me()?.id === userId) banner(subject, body); }
function stockStatus(p){ const a = availTotal(p.id); return a <= 0 ? 'out' : a <= 3 ? 'low' : 'in'; }
const STOCK = {in:['Disponible','var(--success)'], low:['Últimas unidades','var(--warning)'], out:['Agotado','var(--muted)']};
const stockBadge = p => { const [l,c] = STOCK[stockStatus(p)]; return `<span class="sdot"><i style="background:${c}"></i>${l}</span>`; };
function openWindow(b, day){ const wd = (parseDay(day).getDay()+6)%7; const lab = wd <= 4 ? 'Lunes a viernes' : wd === 5 ? 'Sábados' : 'Domingos y festivos'; return b.hours.find(h => h.days === lab) || null; }
function rentPrice(rates, start, end){ const hours = Math.ceil((end-start)/3600e3); const opts = []; if (rates.hora) opts.push([hours*rates.hora,'hora']); if (rates.dia) opts.push([Math.ceil(hours/24)*rates.dia,'dia']); opts.sort((a,b) => a[0]-b[0]); return {price:opts[0][0], pricing:opts[0][1], hours}; }

const MB = {latMin:6.975, latMax:7.135, lngMin:-73.190, lngMax:-73.035, W:360, H:390};
const proj = (lat, lng) => [ (lng-MB.lngMin)/(MB.lngMax-MB.lngMin)*MB.W, (MB.latMax-lat)/(MB.latMax-MB.latMin)*MB.H ];
const unproj = (x, y) => ({ lat: MB.latMax - y/MB.H*(MB.latMax-MB.latMin), lng: MB.lngMin + x/MB.W*(MB.lngMax-MB.lngMin) });
const mPerPxX = (MB.lngMax-MB.lngMin)*111320*Math.cos(7.05*Math.PI/180)/MB.W;
const mPerPxY = (MB.latMax-MB.latMin)*110574/MB.H;
let MAPBASE = null;
function mapBase(){
  if (MAPBASE) return MAPBASE;
  let g = '';
  for (let x = 6; x < MB.W; x += 16) g += `<path d="M${x} 0V${MB.H}"/>`;
  for (let y = 8; y < MB.H; y += 16) g += `<path d="M0 ${y}H${MB.W}"/>`;
  const road = pts => `<polyline points="${pts.map(p => proj(p[0],p[1]).map(v => v.toFixed(1)).join(',')).join(' ')}"/>`;
  const L = (lat, lng, txt, extra='') => { const [x,y] = proj(lat,lng); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" ${extra}>${txt}</text>`; };
  MAPBASE = `<rect width="${MB.W}" height="${MB.H}" fill="#0E1B2E"/>
  <g stroke="#13233A" stroke-width="1">${g}</g>

function reserve(productId, qty){ // CU-03: agregar al carrito aparta unidades
  const rows = DB.inventory.filter(i => i.productId === productId && i.available >= qty).sort((a,b) => b.available - a.available);
  if (!rows.length) return 'No hay unidades suficientes disponibles.';
  const i = rows[0]; i.available -= qty; i.reserved += qty;
  const c = cart(); const ex = c.items.find(x => x.productId === productId && x.branchId === i.branchId);
  if (ex) { ex.qty += qty; ex.expiresAt = now()+RES_MIN*60e3; } else c.items.push({id:uid('ci'), productId, branchId:i.branchId, qty, unitPrice:prod(productId).price, expiresAt:now()+RES_MIN*60e3});
  c.items.forEach(x => x.expiresAt = now()+RES_MIN*60e3);
  save(); return null;
}
function releaseItems(items){ items.forEach(it => { const i = inv(it.productId, it.branchId); if (i){ i.reserved = Math.max(0, i.reserved-it.qty); i.available += it.qty; } }); }
function removeCartItem(id){ const c = cart(); const it = c.items.find(x => x.id === id); if (!it) return; releaseItems([it]); c.items = c.items.filter(x => x.id !== id); save(); }
function pickupBranches(items){ // sucursales que pueden entregar todo el carrito
  return DB.branches.filter(b => b.active && b.services.includes('recogida') && items.every(it => { const i = inv(it.productId, b.id); const mine = items.filter(x => x.productId === it.productId && x.branchId === b.id).reduce((s,x)=>s+x.qty,0); const need = items.filter(x => x.productId === it.productId).reduce((s,x)=>s+x.qty,0); return i && i.available + mine >= need; }));
}
function validCustomer(c){
  if ((c.fullName||'').trim().split(/\s+/).length < 2) return 'Escribe tu nombre completo.';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email||'')) return 'Escribe un correo válido.';
  if (!/^3\d{9}$/.test((c.phone||'').replace(/\D/g,''))) return 'Escribe un celular colombiano de 10 dígitos.';
  if (!/^[A-Za-z0-9-]{5,20}$/.test((c.doc||'').trim())) return 'Escribe un número de documento válido.';
  return null;
}
function createPurchase(co){ // CU-03 + CU-06
  const u = me(); const c = cart();
  if (!c.items.length) return {err:'Tu carrito está vacío.'};
  const ce = validCustomer(co.customer); if (ce) return {err:ce};
  let b;
  if (co.method === 'domicilio'){
    if ((co.address||'').trim().length < 5) return {err:'Escribe la dirección de entrega.'};
    if (!CITIES.includes(co.city)) return {err:'Solo hacemos domicilios en el área metropolitana de Bucaramanga.'};
    b = c.items[0].branchId;
  } else {
    if (!co.branchId) return {err:'Elige la sucursal de recogida.'};
    if (!pickupBranches(c.items).some(x => x.id === co.branchId)) return {err:'Esa sucursal ya no tiene todas las unidades. Elige otra.'};
    b = co.branchId;
  }
  if (!co.date || !co.slot) return {err:'Elige la fecha y la franja horaria.'};
  const s = SLOTS.find(x => x.id === co.slot);
  if (slotPassed(co.date, s)) return {err:'Esa franja ya empezó. Elige otra.'};
  if (slotUsed(b, co.date, co.slot) >= branch(b).slotCapacity) return {err:'Esa franja acaba de llenarse. Elige otra.'};
  if (!co.consent) return {err:'Debes autorizar el tratamiento de tus datos para continuar.'};
  let items = c.items.map(it => ({...it}));
  if (co.method === 'recogida'){ // las unidades se apartan en la sucursal elegida
    releaseItems(items);
    items = Object.values(items.reduce((acc, it) => { (acc[it.productId] = acc[it.productId] || {...it, qty:0}).qty += it.qty; return acc; }, {})).map(it => ({...it, branchId:b}));
    items.forEach(it => { const i = inv(it.productId, b); i.available -= it.qty; i.reserved += it.qty; });
  }
  const id = 'o' + (++DB.seq.order);
  const total = items.reduce((s, it) => s + it.qty*it.unitPrice, 0);
  DB.orders.push({id, code:'EM-'+DB.seq.order, userId:u.id, kind:'compra', status:'pending', total, items:items.map(it => ({productId:it.productId, branchId:it.branchId, qty:it.qty, unitPrice:it.unitPrice})), fulfillment:co.method, branchId:b, address:co.method==='domicilio'?co.address.trim():'', city:co.method==='domicilio'?co.city:'', date:co.date, slot:co.slot, customer:{...co.customer}, paymentExpiresAt:Math.min(...c.items.map(it => it.expiresAt)), createdAt:now()});
  DB.consents.push({id:uid('cs'), userId:u.id, purpose:'pedido', policyVersion:'2026-09', at:now()});
  c.items = []; save(); return {id};
}
function rentPeriod(rc){ if (!rc.startDay || !rc.startTime || !rc.endDay || !rc.endTime) return null; const [a,b] = rc.startTime.split(':').map(Number), [c,d] = rc.endTime.split(':').map(Number); const s = parseDay(rc.startDay); s.setHours(a,b,0,0); const e = parseDay(rc.endDay); e.setHours(c,d,0,0); return {start:s.getTime(), end:e.getTime()}; }
function rentCheck(rc){
  const p = rentPeriod(rc); if (!rc.branchId) return {err:'Elige la sucursal.'}; if (!p) return {err:'Elige la fecha y la hora de recogida y de devolución.'};
  if (p.start < now() + 30*60e3) return {err:'La recogida debe ser al menos 30 minutos después de ahora.'};
  if (p.end <= p.start) return {err:'La devolución debe ser después de la recogida.'};
  if (p.end - p.start < 3600e3) return {err:'El alquiler mínimo es de una hora.'};
  const free = DB.units.filter(x => x.productId === rc.productId && x.branchId === rc.branchId && unitFree(x, p.start, p.end));
  const q = rentPrice(DB.rates[rc.productId], p.start, p.end);
  return {...p, ...q, free};
}
function createRental(rc){ // CU-04: la unidad queda apartada sin cruces de horario
  const u = me(); const r = rentCheck(rc); if (r.err) return r;
  if (!r.free.length) return {err:'No quedan unidades libres para ese horario en esta sucursal. Prueba otro horario o sucursal.'};
  const ce = validCustomer(rc.customer); if (ce) return {err:ce};
  if (!rc.consent) return {err:'Debes autorizar el tratamiento de tus datos para continuar.'};
  const id = 'o' + (++DB.seq.order);
  DB.orders.push({id, code:'EM-'+DB.seq.order, userId:u.id, kind:'alquiler', status:'pending', total:r.price, items:[], unitId:r.free[0].id, productId:rc.productId, startAt:r.start, endAt:r.end, hours:r.hours, pricing:r.pricing, branchId:rc.branchId, customer:{...rc.customer}, paymentExpiresAt:now()+RES_MIN*60e3, createdAt:now()});
  DB.consents.push({id:uid('cs'), userId:u.id, purpose:'alquiler', policyVersion:'2026-09', at:now()});
  save(); return {id};
}

const Gateway = { name:'Pasarela de pagos', sandbox:true, checkoutUrl:o => '#pagos-simulador', getTransaction:(ref, decision) => ({id:'TX'+hash(ref+now()).toUpperCase(), reference:ref, status:decision}) };
function destNear(b){ return [b.lat + rnd(-.010,.010), b.lng + rnd(-.009,.009)]; }
function applyPayment(orderId, status, method){ // CU-05: aplicar dos veces no cambia nada
  const o = order(orderId);
  const tx = Gateway.getTransaction(o.code, status);
  const p = {id:uid('pay'), orderId, provider:Gateway.name, method, reference:tx.id, amount:o.total, status, requiresRefund:false, at:now()};
  DB.payments.push(p);
  if (status !== 'approved' || o.status !== 'pending') { save(); return p; }
  if (o.kind === 'compra'){
    o.items.forEach(it => { const i = inv(it.productId, it.branchId); i.reserved = Math.max(0, i.reserved-it.qty); i.total -= it.qty; DB.movements.push({id:uid('mv'), productId:it.productId, branchId:it.branchId, kind:'venta', qty:-it.qty, balanceAfter:i.total, reason:'Venta '+o.code, at:now(), by:'Sistema'}); });

  const iv = {id:uid('inv'), number:++DB.seq.invoice, prefix:'FEEM', orderId, total:o.total, at:now()}; DB.invoices.push(iv);
  notify(o.userId, 'Correo', `Factura ${iv.prefix}-${iv.number}`, `Tu pago de ${money(o.total)} para ${o.code} fue aprobado. Adjuntamos la factura electrónica en PDF y XML.`);
  if (o.kind === 'compra' && o.fulfillment === 'domicilio'){ // el domicilio nace al aprobarse el pago
    const b = branch(o.branchId); const [la, ln] = destNear(b);
    const d = {id:uid('dl'), orderId:o.id, status:'creado', courierId:null, trackingToken:hash(o.id+now()).slice(0,8), confirmationCode:code6(), proofMethod:null, proof:null, failureReason:'', destLat:la, destLng:ln, events:[{status:'creado', at:now(), by:'Sistema'}]};

function cancelOrder(o){ // CU-15: lo no pagado lo cancela el cliente

function setDStatus(d, status, by, note=''){

function insideAny(dv){ return DB.geofences.filter(g => g.active).some(g => distM(g, dv) <= g.radius); }
function evalGeofence(dv){ // CU-11: se abre al salir de todas las zonas y se cierra sola al volver
  if (!DB.geofences.some(g => g.active)) { DB.alerts.filter(a => a.deviceId === dv.id && !a.closedAt).forEach(a => a.closedAt = now()); return; }
  const open = DB.alerts.find(a => a.deviceId === dv.id && !a.closedAt); const inside = insideAny(dv);
  if (!inside && !open) DB.alerts.unshift({id:uid('al'), deviceId:dv.id, openedAt:now(), closedAt:null});
  if (inside && open) open.closedAt = now();
}
function stepToward(dv, target, step){ const dLat = target.lat - dv.lat, dLng = target.lng - dv.lng; const dd = Math.hypot(dLat, dLng); if (dd < step) { dv.lat = target.lat; dv.lng = target.lng; return; } dv.lat += dLat/dd*step; dv.lng += dLng/dd*step; }
function simTick(){
  const t = now();
  DB.devices.forEach(dv => {
    if (!dv.active) return;
    if (dv.lost > 0) { dv.lost--; if (dv.lost === 0) dv.signal = true; return; }
    if (Math.random() < 0.01) { dv.signal = false; dv.lost = 3 + Math.floor(Math.random()*4); return; }
    if (dv.kind === 'courier'){
      const a = DB.deliveries.find(d => d.courierId === dv.ownerId && ['en_recogida','en_transito'].includes(d.status));
      if (a){ const o = order(a.orderId); stepToward(dv, a.status === 'en_recogida' ? branch(o.branchId) : {lat:a.destLat, lng:a.destLng}, 0.0005); }
      else { dv.lat += rnd(-.0003,.0003); dv.lng += rnd(-.0003,.0003); }
    } else {
      const u = unit(dv.ownerId);
      if (u && rentalNow(u)){ const drone = u.usageUnit === 'horas'; dv.lat += rnd(-.0009,.0009) + (drone ? -.00008 : 0); dv.lng += rnd(-.0009,.0009) + (drone ? -.0001 : 0); }
      else if (u) { const b = branch(u.branchId); dv.lat += (b.lat - dv.lat)*0.3; dv.lng += (b.lng - dv.lng)*0.3; }
    }
    dv.lat = Math.min(MB.latMax-.002, Math.max(MB.latMin+.002, dv.lat)); dv.lng = Math.min(MB.lngMax-.002, Math.max(MB.lngMin+.002, dv.lng));
    dv.lastSeen = t; if (Math.random() < .06) dv.battery = Math.max(5, dv.battery - 1);
    evalGeofence(dv);
  });
  save();
  const fresh = DB.alerts.filter(a => !a.closedAt && !UI.seenAlerts.has(a.id));
  if (fresh.length && role() === 'admin') { beep(); toast(`Alerta: ${devLabel(device(fresh[0].deviceId))} salió de las zonas permitidas`); }
  fresh.forEach(a => UI.seenAlerts.add(a.id));
  liveRefresh();
}
function clockTick(){
  let changed = false;
  Object.entries(DB.carts).forEach(([k, c]) => { const exp = c.items.filter(it => it.expiresAt <= now()); if (exp.length){ releaseItems(exp); c.items = c.items.filter(it => it.expiresAt > now()); changed = true; if (me()?.id === k) toast('Tu reserva venció y las unidades volvieron a estar disponibles.'); } });
  DB.orders.forEach(o => { if (o.status === 'pending' && o.paymentExpiresAt && o.paymentExpiresAt <= now()) { cancelOrder(o); changed = true; } });
  if (changed) { save(); render(true); return; }
  document.querySelectorAll('[data-until]').forEach(el => { const ms = Math.max(0, +el.dataset.until - now()); const m = Math.floor(ms/60000), s = Math.floor(ms/1000)%60; el.textContent = `${m}:${String(s).padStart(2,'0')}`; });
}

VIEWS.track = ({id}) => {
  const d = DB.deliveries.find(x => x.trackingToken === id);
  if (!d) return { title:'Seguimiento', html: empty('route','Este enlace de seguimiento no existe o ya venció.') };
  const o = order(d.orderId); const dv = d.courierId ? device(courier(d.courierId).deviceId) : null;
  const moving = d.status === 'en_transito' && dv; const dist = moving ? distM(dv, {lat:d.destLat, lng:d.destLng}) : 0; const eta = Math.max(1, Math.round(dist / 250));
  return { title:'Seguimiento', html:`
    <div class="between"><div><span class="eyebrow">Pedido ${esc(o.code)}</span><h2 class="title d">${DEL_ST[d.status][0]}</h2></div>${pillOf(DEL_ST,d.status)}</div>
    <div id="trk-map" data-live>${moving ? `${mapSVG({markers:[{lat:d.destLat, lng:d.destLng, type:'dest', color:'#F2B35A'}, {lat:dv.lat, lng:dv.lng, label:'Domiciliario', pulse:dv.signal, lost:!dv.signal, r:7}], live:true, h:330})}
      <div class="card between" style="margin-top:10px"><div><b class="num dt" style="font-size:22px">${dist < 60 ? 'Llegando' : `${eta} min`}</b><div class="muted small">${km(dist)} de distancia</div></div><div class="small muted" style="text-align:right">${dv.signal ? `Actualizado ${ago(dv.lastSeen)}` : '<b style="color:var(--warning)">Sin señal GPS</b><br>Última posición conocida'}</div></div>`
      : `<div class="note">${ico('info','s')}<span>${d.status==='entregado' ? 'Tu pedido fue entregado. El seguimiento terminó.' : d.status==='fallido' ? 'No pudimos completar la entrega. Te contactaremos para reprogramarla.' : 'La ubicación del domiciliario aparece cuando el pedido va en camino.'}</span></div>`}</div>
    <div class="card" id="trk-tl" data-live>${timeline(d)}</div>
    <p class="muted small" style="margin:0">Por privacidad, este enlace no muestra la dirección, el nombre del cliente ni el código de entrega.</p>` };
};

function fleetMap(filter, h=MB.H){
  const mk = DB.devices.filter(dv => dv.active && (filter === 'all' || (filter === 'courier' ? dv.kind === 'courier' : dv.kind === 'unit'))).map(dv => {
    const out = DB.alerts.some(a => a.deviceId === dv.id && !a.closedAt); let color = '#39E58C', label = '';
    if (dv.kind === 'courier') { color = '#F2B35A'; label = courier(dv.ownerId).name.split(' ')[0]; } else { const u = unit(dv.ownerId); color = rentalNow(u) ? '#7DB6F5' : unitBlocked(u) ? '#5F7A99' : '#39E58C'; }
    if (out) { color = '#FF6B5B'; label = devLabel(dv).split(' · ')[0]; }
    return {lat:dv.lat, lng:dv.lng, color, lost:!dv.signal, pulse:out, label, r: dv.kind === 'courier' ? 6.5 : 4.5};
  });
  return mapSVG({markers:[...DB.branches.map(b => ({type:'branch', lat:b.lat, lng:b.lng})), ...mk], zones:DB.geofences, live:true, h, legend:[['Disponible','#39E58C'],['Alquilada','#7DB6F5'],['Domiciliario','#F2B35A'],['Fuera de zona','#FF6B5B']]});
}

    ${UI.val.tab === 'qr' ? `<form class="form" data-form="valQR"><div class="note">${ico('qr','s')}<span>Pide al cliente el código de su orden y escríbelo. El servidor lo compara: el panel nunca lo ve.</span></div><div class="field"><label for="vc">Código del cliente</label><input id="vc" name="code" class="input code" maxlength="6" autocomplete="off" autocapitalize="characters" style="font-size:24px" required></div><button class="btn block" type="submit">Validar código</button></form>`

let SIG = {pts:0};
function initSig(){
  const cv = document.getElementById('sig'); if (!cv) return;
  const r = cv.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1; cv.width = r.width*dpr; cv.height = r.height*dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = getComputedStyle(document.body).color;
  SIG = {pts:0}; let drawing = false; const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { drawing = true; cv.setPointerCapture(e.pointerId); const [x,y] = pos(e); ctx.beginPath(); ctx.moveTo(x,y); };
  cv.onpointermove = e => { if (!drawing) return; const [x,y] = pos(e); ctx.lineTo(x,y); ctx.stroke(); SIG.pts++; };
  cv.onpointerup = cv.onpointercancel = () => drawing = false;
}

  maintStart:(d) => { const u = unit(d.id); u.status = 'mantenimiento'; DB.maintLogs.push({id:uid('ml'), unitId:u.id, kind:'inicio', delta:0, after:u.usage, note:'Entrada manual a taller.', by:userName(me().id), at:now()}); save(); toast(`${u.code} salió de la oferta`); render(true); },
  maintForm:(d) => { const u = unit(d.id); openSheet(`Terminar mantenimiento · ${u.code}`, `<form class="form" data-form="maint"><input type="hidden" name="id" value="${u.id}"><div class="field"><label for="mp">Trabajo realizado y piezas cambiadas</label><textarea id="mp" name="parts" class="input" placeholder="Ej. pastillas de freno, ajuste de dirección" required></textarea></div><div class="field"><label for="mt">Técnico responsable</label><input id="mt" name="tech" class="input" value="Óscar Méndez" required></div><div class="note">${ico('info','s')}<span>El uso vuelve a 0 y la unidad queda operativa para alquilar.</span></div><button class="btn block" type="submit">Registrar en bitácora</button></form>`); },
  adjust:(d) => { const i = inv(d.p, d.b); openSheet(`${prod(d.p).name} · ${branch(d.b).name}`, `<div class="grid2"><div class="kpi"><b>${i.available}</b><span>Disponibles</span></div><div class="kpi"><b>${i.reserved}</b><span>Reservadas</span></div></div><form class="form" data-form="adjust"><input type="hidden" name="p" value="${d.p}"><input type="hidden" name="b" value="${d.b}"><div class="field"><label for="at">Unidades físicas (mínimo ${i.reserved})</label><input id="at" name="total" type="number" min="0" class="input num" value="${i.total}" required></div><div class="field"><label for="ar">Motivo</label><select id="ar" name="reason" class="input"><option>Ingreso de mercancía</option><option>Traslado entre sucursales</option><option>Conteo físico</option><option>Daño o pérdida</option></select></div><button class="btn block" type="submit">Guardar ajuste</button></form>`); },
  prodToggle:(d) => { const p = prod(d.id); p.active = !p.active; save(); toast(p.active ? 'Producto publicado' : 'Producto oculto del catálogo'); render(true); },
  newProduct:() => openSheet('Nuevo producto', `<form class="form" data-form="newProduct"><div class="field"><label for="np">Nombre</label><input id="np" name="name" class="input" required minlength="3"></div><div class="grid2"><div class="field"><label for="nc">Categoría</label><select id="nc" name="cat" class="input">${CATS.map(c => `<option value="${c.slug}">${c.name}</option>`).join('')}</select></div><div class="field"><label for="nb">Marca</label><input id="nb" name="brand" class="input" required></div></div><div class="field"><label for="npr">Precio (COP)</label><input id="npr" name="price" type="number" min="1000" step="1000" class="input num" required></div><div class="field"><label for="nd">Descripción corta</label><textarea id="nd" name="desc" class="input" required></textarea></div><button class="btn block" type="submit">Crear producto</button></form>`),
  dFilter:(d) => { UI.dFilter = d.val; render(true); },
  assign:(d) => { const dl = curDelivery(d.id); const sug = suggestCouriers(dl); openSheet('Asignar domiciliario', `<p class="muted small" style="margin:0">Ordenados por carga actual y cercanía a la sucursal que despacha.</p><div class="opts">${sug.map((s,i) => `<button class="opt" data-act="assignDo" data-id="${dl.id}" data-c="${s.c.id}" ${dl.courierId===s.c.id?'aria-pressed="true"':''}><span class="ic">${ico('truck','s')}</span><div class="grow"><b>${esc(s.c.name)}</b>${i===0?' <span class="pill volt">Sugerido</span>':''}<div class="small muted">a ${km(s.dist)} · ${s.load} en curso</div></div></button>`).join('')}</div>`); },
  assignDo:(d) => { const dl = curDelivery(d.id); const c = courier(d.c); const by = userName(me().id); if (dl.status === 'creado') setDStatus(dl, 'asignado', by, c.name); else dl.events.push({status:'asignado', at:now(), by, note:'Reasignado a '+c.name}); dl.courierId = c.id; save(); closeSheet(); toast(`Asignado a ${c.name}`); render(true); },
  dState:(d) => { const err = setDStatus(curDelivery(d.id), d.s, userName(me().id)); if (err) toast(err); render(true); },
  validate:(d) => sheetValidate(curDelivery(d.id)),
  valTab:(d) => { UI.val.tab = d.val; UI.val.err = ''; renderSheet(); },
  sigClear:() => initSig(),
  failForm:(d) => openSheet('No se pudo entregar', `<form class="form" data-form="fail"><input type="hidden" name="id" value="${d.id}"><div class="field"><label for="fr">Motivo</label><select id="fr" name="reason" class="input"><option>Cliente ausente</option><option>Dirección incorrecta</option><option>Cliente rechazó el pedido</option><option>Novedad en la vía</option></select></div><div class="field"><label for="fn">Detalle</label><textarea id="fn" name="note" class="input"></textarea></div><button class="btn block danger" type="submit">Registrar</button></form>`),
  reprogram:(d) => { const dl = curDelivery(d.id); const o = order(dl.orderId); UI.rep = {id:dl.id, date:dayOffset(1), slot:null}; openSheet('Reprogramar domicilio', () => `${slotPicker(UI.rep, [o.branchId], 'rep')}<button class="btn block" data-act="repDo">Reprogramar</button>`); },
  rep:(d) => { UI.rep[d.k] = d.val; if (d.k === 'date') UI.rep.slot = null; renderSheet(); },
  repDo:() => { const R = UI.rep; if (!R.slot) { toast('Elige una franja.'); return; } const dl = curDelivery(R.id); const o = order(dl.orderId); o.date = R.date; o.slot = R.slot; dl.failureReason = ''; dl.courierId = null; setDStatus(dl, 'creado', userName(me().id), `Reprogramado para ${fmtDate(R.date)}`); notify(o.userId, 'SMS', 'Domicilio reprogramado', `Tu pedido ${o.code} llegará el ${fmtDate(R.date)}, ${SLOTS.find(s=>s.id===R.slot).label}.`); save(); closeSheet(); toast('Domicilio reprogramado'); render(true); },
  cmsTab:(d) => { UI.cms = d.val; render(true); },
  cmsEdit:(d) => sheetCms(d.id),
  cmsDel:(d) => { DB.content[UI.cms] = DB.content[UI.cms].filter(x => x.id !== d.id); save(); closeSheet(); toast('Contenido eliminado'); render(true); },
  refundResolve:(d) => { const r = DB.refunds.find(x => x.id === d.id); openSheet(d.s === 'aprobado' ? 'Registrar reembolso' : 'Rechazar solicitud', `<form class="form" data-form="refundResolve"><input type="hidden" name="id" value="${r.id}"><input type="hidden" name="s" value="${d.s}"><div class="field"><label for="rn">Nota para el cliente</label><textarea id="rn" name="note" class="input" required>${d.s==='aprobado'?'Registramos tu reembolso. Verás el dinero en tu medio de pago en 5 a 8 días hábiles.':''}</textarea></div>${d.s==='aprobado'?`<div class="note">${ico('info','s')}<span>El pago queda marcado para devolución manual en la pasarela y las unidades vuelven al inventario.</span></div>`:''}<button class="btn block ${d.s==='aprobado'?'':'danger'}" type="submit">${d.s==='aprobado'?'Registrar reembolso':'Rechazar'}</button></form>`); },
};

/* ---------- formularios ---------- */
const FORM = {
  login:(f) => {
    const email = (f.email||'').trim().toLowerCase(); const eh = hash(email);
    const recent = DB.loginAttempts.filter(a => a.emailHash === eh && !a.ok && a.at > now()-15*60e3).length;
    if (recent >= 5) { UI.authErr = 'Superaste el límite de intentos. Espera 15 minutos e inténtalo de nuevo.'; render(true); return; }
    const u = DB.users.find(x => x.email === email); const ok = !!u && u.pass === hash(f.pass) && u.active;
    DB.loginAttempts.push({emailHash:eh, ok, at:now()});
    if (!ok) { UI.authErr = 'Correo o contraseña incorrectos.'; save(); render(true); return; }
    DB.session = {userId:u.id, exp:now()+7*86400e3}; UI.authErr = ''; save(); toast(`Hola, ${u.first}`); go(TABS[u.role][0][0], {}, {root:true});
  },
  register:(f) => {
    const email = (f.email||'').trim().toLowerCase();
    if (!f.first?.trim() || !f.last?.trim()) UI.authErr = 'Escribe tu nombre y apellido.';
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) UI.authErr = 'Escribe un correo válido.';
    else if (!/^3\d{9}$/.test((f.phone||'').replace(/\D/g,''))) UI.authErr = 'Escribe un celular colombiano de 10 dígitos.';
    else if (DB.users.some(u => u.email === email)) UI.authErr = 'Ya existe una cuenta con ese correo. Inicia sesión.';
    else if ((f.pass||'').length < 8 || !/\d/.test(f.pass)) UI.authErr = 'La contraseña necesita al menos 8 caracteres y un número.';
    else if (!f.consent) UI.authErr = 'Debes autorizar el tratamiento de datos para crear la cuenta.';
    else {
      const u = {id:uid('u'), email, pass:hash(f.pass), first:f.first.trim(), last:f.last.trim(), phone:f.phone.replace(/\D/g,''), docType:'CC', doc:'', role:'cliente', active:true, createdAt:now()};
      DB.users.push(u); DB.consents.push({id:uid('cs'), userId:u.id, purpose:'registro', policyVersion:'2026-09', at:now()});
      DB.session = {userId:u.id, exp:now()+7*86400e3}; notify(u.id, 'Correo', 'Bienvenido a EcoMovilidad', 'Tu cuenta quedó creada. Ya puedes comprar y alquilar.'); UI.authErr = ''; save(); toast('Cuenta creada'); go('home', {}, {root:true}); return;
    }
    render(true);
  },
  forgot:(f) => { const email = (f.email||'').trim().toLowerCase(); closeSheet(); toast(`Si ${email} tiene una cuenta, te llegará un enlace en unos minutos.`); },
  editProfile:(f) => { const u = me(); if ((f.first||'').trim().length < 2 || (f.last||'').trim().length < 2) { toast('Escribe tu nombre y apellido.'); return; } if (!/^3\d{9}$/.test((f.phone||'').replace(/\D/g,''))) { toast('Escribe un celular colombiano de 10 dígitos.'); return; } u.first = f.first.trim(); u.last = f.last.trim(); u.phone = f.phone.replace(/\D/g,''); u.docType = f.docType; u.doc = (f.doc||'').trim(); save(); toast('Datos guardados'); back(); },
  refund:(f) => { const o = order(f.id); if ((f.reason||'').trim().length < 8) { toast('Describe el motivo con un poco más de detalle.'); return; } DB.refunds.push({id:uid('rf'), orderId:o.id, reason:f.reason.trim(), status:'pendiente', note:'', createdAt:now(), resolvedAt:null}); notify('u-adm', 'Sistema', `Solicitud de reembolso ${o.code}`, f.reason.trim()); save(); closeSheet(); toast('Solicitud enviada. Te avisaremos la respuesta.'); render(true); },
  refundResolve:(f) => {
    const r = DB.refunds.find(x => x.id === f.id); const o = order(r.orderId); const p = paymentOf(o.id);
    r.status = f.s; r.note = f.note.trim(); r.resolvedAt = now();
    if (f.s === 'aprobado'){
      o.status = 'cancelled'; if (p) p.requiresRefund = true;
      if (o.kind === 'compra') o.items.forEach(it => { const i = inv(it.productId, it.branchId); i.total += it.qty; i.available += it.qty; DB.movements.push({id:uid('mv'), productId:it.productId, branchId:it.branchId, kind:'devolucion', qty:it.qty, balanceAfter:i.total, reason:'Reembolso '+o.code, at:now(), by:userName(me().id)}); });
      DB.deliveries.filter(d => d.orderId === o.id && !['entregado','fallido'].includes(d.status)).forEach(d => { d.status = 'fallido'; d.failureReason = 'Pedido reembolsado'; d.events.push({status:'fallido', at:now(), by:'Sistema', note:'Pedido reembolsado'}); });
    }
    notify(o.userId, 'Correo', f.s === 'aprobado' ? `Reembolso registrado ${o.code}` : `Solicitud de reembolso ${o.code}`, r.note);
    save(); closeSheet(); toast(f.s === 'aprobado' ? 'Reembolso registrado' : 'Solicitud rechazada'); render(true);
  },
  geofence:(f) => { const g = UI.gf; const name = (f.name||'').trim(); if (g.lat == null || name.length < 3) { toast('Elige el centro en el mapa y escribe un nombre.'); return; } DB.geofences.push({id:uid('gf'), name, lat:g.lat, lng:g.lng, radius:g.radius, active:true}); UI.gf = {lat:null, lng:null, radius:1200, name:''}; DB.devices.forEach(evalGeofence); save(); toast('Zona guardada y activa'); render(true); },
  threshold:(f) => { const u = unit(f.id); const t = +f.threshold; if (!(t >= 10)) { toast('El umbral debe ser de al menos 10.'); return; } if (t === u.threshold) return; DB.maintLogs.push({id:uid('ml'), unitId:u.id, kind:'umbral', delta:0, after:u.usage, note:`Umbral de ${u.threshold} a ${t} ${u.usageUnit}.`, by:userName(me().id), at:now()}); u.threshold = t; if (u.status === 'operativo' && u.usage >= t*MAINT_PCT) { u.status = 'mantenimiento'; DB.maintLogs.push({id:uid('ml'), unitId:u.id, kind:'bloqueo', delta:0, after:u.usage, note:'Con el nuevo umbral supera el 90 %: salió de la oferta.', by:'Sistema', at:now()}); } save(); toast('Umbral actualizado'); render(true); },
  usage:(f) => { const u = unit(f.id); const d = Math.round(+f.delta*10)/10; if (!(d > 0)) { toast('Escribe una cantidad mayor a 0.'); return; } const blocked = addUsage(u, d, userName(me().id), (f.note||'').trim()); save(); closeSheet(); toast(blocked ? `${u.code} llegó al 90 % y salió de la oferta` : 'Uso registrado'); render(true); },
  maint:(f) => { const u = unit(f.id); DB.maintLogs.push({id:uid('ml'), unitId:u.id, kind:'fin', delta:-u.usage, after:0, note:`${f.parts.trim()} · Técnico: ${f.tech.trim()}`, by:f.tech.trim(), at:now()}); u.usage = 0; u.status = 'operativo'; save(); closeSheet(); toast(`${u.code} vuelve a operar`); render(true); },
  adjust:(f) => {
    const i = inv(f.p, f.b); const t = Math.floor(+f.total);
    if (!(t >= 0)) { toast('Escribe una cantidad válida.'); return; }
    if (t < i.reserved) { toast(`No puedes dejar menos de ${i.reserved}: están reservadas.`); return; }
    const delta = t - i.total; if (!delta) { closeSheet(); return; }
    i.total = t; i.available = t - i.reserved;
    DB.movements.push({id:uid('mv'), productId:f.p, branchId:f.b, kind:delta > 0 ? 'entrada' : 'salida', qty:delta, balanceAfter:t, reason:f.reason, at:now(), by:userName(me().id)});
    save(); closeSheet(); toast('Inventario actualizado'); render(true);
  },
  newProduct:(f) => {
    const id = f.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + Math.random().toString(36).slice(2,5);
    DB.products.push({id, slug:id, sku:'EM-'+id.toUpperCase().slice(0,10), name:f.name.trim(), brand:f.brand.trim(), cat:f.cat, short:f.desc.trim(), desc:f.desc.trim(), price:+f.price, compareAt:0, featured:false, active:true, highlights:[], specs:[], img:null});
    DB.branches.forEach(b => DB.inventory.push({productId:id, branchId:b.id, available:0, reserved:0, total:0}));
    save(); closeSheet(); toast('Producto creado. Ajusta sus existencias.'); render(true);
  },
  fail:(f) => { const d = curDelivery(f.id); const reason = f.reason + (f.note?.trim() ? ` — ${f.note.trim()}` : ''); d.failureReason = reason; const err = setDStatus(d, 'fallido', userName(me().id), reason); if (err) toast(err); closeSheet(); render(true); },
  valQR:(f) => { const d = curDelivery(UI.val.id); if ((f.code||'').trim().toUpperCase() !== d.confirmationCode) { UI.val.err = 'El código no coincide con este pedido. Pide al cliente que lo revise o confirma con firma.'; renderSheet(); return; } completeDelivery(d, 'qr', {code:'verificado'}, userName(me().id)); closeSheet(); toast('Entrega confirmada con código QR'); render(true); },
  valSig:(f) => { const d = curDelivery(UI.val.id); if (SIG.pts < 15) { UI.val.err = 'La firma está vacía o incompleta.'; renderSheet(); return; } if (!/^[A-Za-z0-9-]{5,20}$/.test((f.doc||'').trim())) { UI.val.err = 'Escribe un número de documento válido.'; renderSheet(); return; } const img = document.getElementById('sig').toDataURL('image/png'); completeDelivery(d, 'firma', {doc:f.doc.trim(), signature:img.length > 40000 ? 'capturada' : img}, userName(me().id)); closeSheet(); toast('Entrega confirmada con firma'); render(true); },
  cms:(f, form, submitter) => {
    const mode = submitter?.value || 'publish'; const t = UI.cms; const D = UI.cmsDraft;
    const title = (f.title||'').trim(); const desc = ((t === 'news' ? f.excerpt : f.description) || '').trim();
    if (title.length < 4) UI.cmsErr = 'El título necesita al menos 4 caracteres.';
    else if (!desc) UI.cmsErr = t === 'news' ? 'Escribe el resumen.' : 'Escribe la descripción.';
    else if (t !== 'news' && desc.length > 160) UI.cmsErr = `La descripción tiene ${desc.length} caracteres; el máximo es 160.`;
    else if (t === 'banners' && f.startsAt && f.endsAt && f.endsAt < f.startsAt) UI.cmsErr = 'La fecha final debe ser posterior a la inicial.';
    else UI.cmsErr = '';
    if (UI.cmsErr) { renderSheet(); return; }
    const pub = mode === 'publish'; let it;
    if (t === 'banners') it = {title, description:desc, ctaLabel:(f.ctaLabel||'Ver más').trim(), ctaTarget:f.ctaTarget, startsAt:f.startsAt, endsAt:f.endsAt, active:pub};
    else if (t === 'valueProps') it = {title, description:desc, icon:f.icon, position:+f.position||1, active:pub};
    else it = {title, excerpt:desc, published:pub, publishedAt: pub ? (D.publishedAt || now()) : D.publishedAt || null};
    const coll = DB.content[t];
    if (f.id) Object.assign(coll.find(x => x.id === f.id), it); else coll.push(Object.assign({id:uid(t.slice(0,2))}, it));
    save(); closeSheet(); toast(pub ? 'Publicado en la tienda' : 'Guardado como borrador'); render(true);
  },
};

/* ---------- eventos ---------- */
document.addEventListener('click', ev => { const el = ev.target.closest('[data-act]'); if (!el) return; const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el, ev); });
document.addEventListener('submit', ev => { const form = ev.target.closest('[data-form]'); if (!form) return; ev.preventDefault(); FORM[form.dataset.form]?.(Object.fromEntries(new FormData(form).entries()), form, ev.submitter); });
let qT;
document.addEventListener('input', ev => {
  const t = ev.target, k = t.dataset.input; if (!k) return; const v = t.value;
  if (k === 'q') { UI.f.q = v; clearTimeout(qT); qT = setTimeout(() => { const tmp = document.createElement('div'); tmp.innerHTML = VIEWS.shop().html; const a = document.getElementById('shop-results'), b = tmp.querySelector('#shop-results'); if (a && b) a.innerHTML = b.innerHTML; }, 200); }
  if (k === 'cust') (t.dataset.p === 'co' ? UI.co : UI.rc).customer[t.dataset.k] = v;
  if (k === 'coAddr') UI.co.address = v;
  if (k === 'gfName') UI.gf.name = v;
  if (k === 'cmsField') { UI.cmsDraft[t.dataset.k] = v; const pv = document.getElementById('cms-prev'); if (pv) pv.innerHTML = UI.cmsPreview(); }
});
document.addEventListener('change', ev => {
  const t = ev.target, k = t.dataset.change; if (!k) return; const v = t.type === 'checkbox' ? t.checked : t.value;
  if (k === 'brand' || k === 'sort') { UI.f[k] = v; render(true); }
  if (k === 'max') { const mx = Math.max(...DB.products.map(p => p.price)); UI.f.max = +v >= mx ? 0 : +v; render(true); }
  if (k === 'gfRadius') { UI.gf.radius = +v; render(true); }
  if (k === 'cust') (t.dataset.p === 'co' ? UI.co : UI.rc).customer[t.dataset.k] = v;
  if (k === 'coCity') UI.co.city = v;
  if (k === 'coConsent') UI.co.consent = v;
  if (k === 'rcConsent') UI.rc.consent = v;
  if (k === 'rcTime') { UI.rc[t.dataset.k] = v; render(true); }
  if (k === 'pref') { UI.prefs[t.dataset.k] = v; try { localStorage.setItem('em-prefs', JSON.stringify(UI.prefs)); } catch(e){} }
  if (k === 'cmsField') { UI.cmsDraft[t.dataset.k] = v; const pv = document.getElementById('cms-prev'); if (pv) pv.innerHTML = UI.cmsPreview(); }
});
document.addEventListener('pointerdown', () => { if (!UI.audio) { try { UI.audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } }, {once:true});
function fromHash(){ const h = location.hash.slice(1); if (h.startsWith('t-')) { UI.stack = []; UI.view = 'track'; UI.params = {id:h.slice(2)}; } }
window.addEventListener('hashchange', () => { fromHash(); render(); });

/* ---------- arranque ---------- */
UI.view = TABS[role()][0][0];
fromHash(); render();
const ONB = [
  ['voltra-urbana-e1','Movilidad eléctrica en tu bolsillo','Compra bicicletas, patinetas, patines y drones con factura electrónica.'],
  ['voltra-s2-urbana','Alquila por horas o días','Reserva en línea y recoge en cualquiera de nuestras cinco sucursales.'],
  ['aeroandes-mini-4k','Sigue tu domicilio en el mapa','Confirma la entrega con el código QR de tu orden.'],
];
let onbI = 0;
function renderOnb(){ const [img, t, d] = ONB[onbI]; $('#onb').innerHTML = `<div class="onb"><button class="skip" data-act="onbEnd">Omitir</button><div class="pic">${IMGS[img]?`<img src="${IMGS[img]}" alt="">`:LOGO}</div><div class="dots">${ONB.map((_,i) => `<i class="${i===onbI?'on':''}"></i>`).join('')}</div><h2 class="d">${t}</h2><p>${d}</p><button class="btn brand block" data-act="${onbI < ONB.length-1 ? 'onbNext' : 'onbEnd'}">${onbI < ONB.length-1 ? 'Siguiente' : 'Empezar'}</button></div>`; }
ACT.onbNext = () => { onbI++; renderOnb(); };
ACT.onbEnd = () => { $('#onb').innerHTML = ''; try { localStorage.setItem('em-onboarded','1'); } catch(e){} };
let onboarded = false; try { onboarded = !!localStorage.getItem('em-onboarded'); } catch(e){ onboarded = true; }
if (!onboarded && !location.hash) renderOnb();
setTimeout(() => { const sp = $('#splash'); sp.classList.add('out'); setTimeout(() => sp.remove(), 400); }, 900);
setInterval(clockTick, 1000);
setInterval(simTick, GPS_MS);
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
